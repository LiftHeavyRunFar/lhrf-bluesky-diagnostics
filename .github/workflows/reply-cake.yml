name: One running conversation follow-up
on: workflow_dispatch
permissions: {}
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reply once
        env:
          PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,datetime
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          op=urllib.request.build_opener(NoRedirect())
          base='https://bsky.social/xrpc/'
          did='did:plc:k3qs4p7s7cylcqpvbj5v7dn4'
          uri='at://did:plc:qtya3wv5atp37w3cpaot2zpr/app.bsky.feed.post/3n27pu5uqyc22'
          key='3n27qahldol2b'
          def call(endpoint,data=None,token=None):
              h={'Content-Type':'application/json'}
              if token: h['Authorization']='Bearer '+token
              req=urllib.request.Request(base+endpoint,data=json.dumps(data).encode() if data is not None else None,headers=h)
              with op.open(req,timeout=20) as r: return json.load(r)
          stage='authentication'
          try:
              s=call('com.atproto.server.createSession',{'identifier':'lhrftraining.bsky.social','password':os.environ['PASSWORD']})
              if s.get('did')!=did or s.get('handle','').lower()!='lhrftraining.bsky.social': raise ValueError('identity')
              token=s['accessJwt']; stage='check thread'
              thread=call('app.bsky.feed.getPostThread?'+urllib.parse.urlencode({'uri':uri,'depth':1}),token=token).get('thread',{})
              post=thread.get('post',{})
              if post.get('uri')!=uri or not post.get('record',{}).get('text','').startswith("It's what I call a six hour jobbie"): raise ValueError('target changed')
              if any(x.get('post',{}).get('author',{}).get('did')==did for x in thread.get('replies',[])): raise ValueError('already replied')
              parent={'uri':uri,'cid':post['cid']}; root=post['record']['reply']['root']
              record={'$type':'app.bsky.feed.post','text':'Six hours and cake sounds like quite the Sunday! Hope the legs behave and you enjoy every slice. What cake makes the cut?','createdAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'langs':['en'],'reply':{'root':root,'parent':parent}}
              stage='create reply'
              result=call('com.atproto.repo.createRecord',{'repo':did,'collection':'app.bsky.feed.post','rkey':key,'record':record},token)
              if result.get('uri')!='at://'+did+'/app.bsky.feed.post/'+key: raise ValueError('unexpected result')
              print('Reply created:',key)
          except urllib.error.HTTPError as e:
              print('Stage:',stage,'HTTP',e.code); raise SystemExit(1)
          except Exception as e:
              print('Stage:',stage,'error type:',type(e).__name__); raise SystemExit(1)
          PY
