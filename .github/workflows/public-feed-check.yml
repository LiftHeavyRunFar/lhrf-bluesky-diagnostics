name: Public author feed check
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/public-feed-check.yml
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read LHRF public author feed
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          url = 'https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=lhrftraining.bsky.social&limit=5'
          req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'LHRF-read-only-diagnostic/1.0'})
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  print('HTTP', response.status, 'content-type', response.headers.get('Content-Type'))
                  data = json.load(response)
                  feed = data.get('feed')
                  if not isinstance(feed, list): raise ValueError('missing feed array')
                  print('Feed items:', len(feed))
          except urllib.error.HTTPError as e:
              print('HTTP', e.code, 'content-type', e.headers.get('Content-Type'))
              raise SystemExit(1)
          except Exception as e:
              print('Failed:', type(e).__name__)
              raise SystemExit(1)
          PY
